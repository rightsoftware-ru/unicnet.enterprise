<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-label="UnicNet architecture">
  <style>
    .title { font: 700 20px sans-serif; fill: #1a365d; }
    .box { fill: #edf2f7; stroke: #2b6cb0; stroke-width: 1.5; }
    .pg { fill: #e6fffa; stroke: #319795; }
    .ext { fill: #fff5f5; stroke: #c53030; }
    .lbl { font: 600 13px sans-serif; fill: #1a202c; }
    .sub { font: 11px sans-serif; fill: #4a5568; }
    .cap { font: 12px sans-serif; fill: #2d3748; }
    .line { stroke: #4a5568; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a5568"/>
    </marker>
  </defs>
  <text x="24" y="32" class="title">UnicNet  >48= E>AB (Vault-first, PostgreSQL 18)</text>
  <text x="24" y="52" class="sub">MongoDB 8 RabbitMQ =5B. 8F5=78O JWT 87 .env. Realm unicnet 2 keycloak-import.</text>

  <rect x="40" y="80" width="140" height="56" rx="8" class="ext"/>
  <text x="110" y="104" text-anchor="middle" class="lbl">Browser</text>
  <text x="110" y="122" text-anchor="middle" class="sub">UI :8080</text>

  <rect x="40" y="280" width="140" height="56" rx="8" class="ext"/>
  <text x="110" y="304" text-anchor="middle" class="lbl">license.unic.chat</text>
  <text x="110" y="322" text-anchor="middle" class="sub">GET /api/lic</text>

  <rect x="40" y="480" width="140" height="56" rx="8" class="ext"/>
  <text x="110" y="504" text-anchor="middle" class="lbl">Devices</text>
  <text x="110" y="522" text-anchor="middle" class="sub">SSH SNMP syslog</text>

  <rect x="230" y="70" width="840" height="540" rx="12" fill="#f7fafc" stroke="#2b6cb0" stroke-width="2"/>
  <text x="250" y="96" class="lbl">Host  compose project unicnet</text>

  <rect x="260" y="120" width="160" height="70" rx="8" class="box"/>
  <text x="340" y="148" text-anchor="middle" class="lbl">Frontend</text>
  <text x="340" y="168" text-anchor="middle" class="sub">:8080  UNFrontV2</text>

  <rect x="480" y="120" width="160" height="70" rx="8" class="box"/>
  <text x="560" y="148" text-anchor="middle" class="lbl">Backend</text>
  <text x="560" y="168" text-anchor="middle" class="sub">:30111</text>

  <rect x="700" y="120" width="160" height="70" rx="8" class="box"/>
  <text x="780" y="148" text-anchor="middle" class="lbl">Router</text>
  <text x="780" y="168" text-anchor="middle" class="sub">:30115  CIDR</text>

  <rect x="260" y="240" width="160" height="70" rx="8" class="box"/>
  <text x="340" y="268" text-anchor="middle" class="lbl">Keycloak 26</text>
  <text x="340" y="288" text-anchor="middle" class="sub">:8095  realm unicnet</text>

  <rect x="480" y="240" width="160" height="70" rx="8" class="box"/>
  <text x="560" y="268" text-anchor="middle" class="lbl">Vault</text>
  <text x="560" y="288" text-anchor="middle" class="sub">127.0.0.1:8200</text>

  <rect x="700" y="240" width="160" height="70" rx="8" class="box"/>
  <text x="780" y="268" text-anchor="middle" class="lbl">Logger / SysLog</text>
  <text x="780" y="288" text-anchor="middle" class="sub">:8082  :8001  :514</text>

  <rect x="460" y="420" width="220" height="80" rx="8" class="pg"/>
  <text x="570" y="454" text-anchor="middle" class="lbl">PostgreSQL 18</text>
  <text x="570" y="474" text-anchor="middle" class="sub">volume unicnet_postgres-data</text>

  <line x1="180" y1="108" x2="260" y2="150" class="line"/>
  <line x1="180" y1="308" x2="260" y2="160" class="line"/>
  <line x1="180" y1="508" x2="700" y2="190" class="line"/>
  <line x1="180" y1="508" x2="780" y2="310" class="line"/>
  <line x1="420" y1="155" x2="480" y2="155" class="line"/>
  <line x1="640" y1="155" x2="700" y2="155" class="line"/>
  <line x1="340" y1="190" x2="340" y2="240" class="line"/>
  <line x1="560" y1="190" x2="560" y2="240" class="line"/>
  <line x1="560" y1="310" x2="560" y2="420" class="line"/>
  <line x1="340" y1="310" x2="500" y2="430" class="line"/>
  <line x1="780" y1="310" x2="640" y2="440" class="line"/>

  <text x="250" y="590" class="cap">;85=B0< Vault: Vault__Url + JWT. 8F5=78O Front/Backend/Router: UNIC_LICENSE_DATA 2 .env. install.sh =5 A>740QB .env 8 =5 ;>38=8BAO 2 YCR.</text>
</svg>
