name: unicnet

x-vault-client-environment: &vault-client-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: 8080
  Vault__Url: http://vault:8080/
  Vault__Jwt__SigningKey: ${VAULT_JWT_SIGNING_KEY:?Set VAULT_JWT_SIGNING_KEY in .env}
  Vault__Jwt__Issuer: ${VAULT_JWT_ISSUER:-UniComm PRO Software}
  Vault__Jwt__Audience: ${VAULT_JWT_AUDIENCE:-Service}

services:
  pg:
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/pg:${PG_IMAGE_TAG:?Set PG_IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [unicnet]

  keycloak:
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/keycloak:${KEYCLOAK_IMAGE_TAG:?Set KEYCLOAK_IMAGE_TAG in .env}
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://pg:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?Set KEYCLOAK_PUBLIC_URL in .env}
    volumes:
      - ./keycloak-import:/opt/keycloak/data/import:ro
    ports:
      - "8095:8080"
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      # KC_HEALTH_ENABLED serves /health/* on the management port 9000, not on 8080.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [unicnet]

  vault:
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/unicvault:${UNICVAULT_IMAGE_TAG:?Set UNICVAULT_IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Storage__ConnectionString: Host=pg;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Application Name=Unic.Vault
      Storage__Schema: unicomm
      Vault__Jwt__SigningKey: ${VAULT_JWT_SIGNING_KEY}
      Vault__Jwt__Issuer: ${VAULT_JWT_ISSUER:-UniComm PRO Software}
      Vault__Jwt__Audience: ${VAULT_JWT_AUDIENCE:-Service}
      UseScalar: "true"
    ports:
      - "127.0.0.1:8200:8080"
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/openapi/v1.json >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [unicnet]

  logger:
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/uniclogger:${UNICLOGGER_IMAGE_TAG:?Set UNICLOGGER_IMAGE_TAG in .env}
    restart: unless-stopped
    environment: *vault-client-environment
    ports:
      - "8082:8080"
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      # Logger has no /health endpoint yet; OpenAPI answers only when Kestrel and the app are up.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /openapi/v1.json HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [unicnet]

  router:
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/unicnetrouter:${UNICNETROUTER_IMAGE_TAG:?Set UNICNETROUTER_IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      <<: *vault-client-environment
      UniCommLicenseData: ${UNIC_LICENSE_DATA:?Set UNIC_LICENSE_DATA in .env}
      Router__License__Data: ${UNIC_LICENSE_DATA}
      Api_License_Url: ${API_LICENSE_URL:-https://service.example.org/}
    ports:
      - "30115:8080"
    depends_on:
      vault:
        condition: service_healthy
      logger:
        condition: service_healthy
    healthcheck:
      # TODO(dev): Router has no safe health endpoint: HTTP health on 30115 resets its WSS tunnel.
      test: ["CMD-SHELL", "pidof dotnet >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [unicnet]

  syslog:
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/unicnetsyslog:${UNICNETSYSLOG_IMAGE_TAG:?Set UNICNETSYSLOG_IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      <<: *vault-client-environment
      # Without it SysLog silently validates bearers with a key built into the image and answers 401.
      SysLog__Jwt__SigningKey: ${VAULT_JWT_SIGNING_KEY:?Set VAULT_JWT_SIGNING_KEY in .env}
      SysLog__Jwt__Issuer: ${VAULT_JWT_ISSUER:-UniComm PRO Software}
      SysLog__Jwt__Audience: ${VAULT_JWT_AUDIENCE:-Service}
    ports:
      - "8001:8080"
      - "514:514/udp"
      - "601:601"
      - "601:601/udp"
      - "6514:6514"
    depends_on:
      vault:
        condition: service_healthy
      logger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [unicnet]

  backend:
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/unicnetbackend:${UNICNETBACKEND_IMAGE_TAG:?Set UNICNETBACKEND_IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      <<: *vault-client-environment
      UniCommLicenseData: ${UNIC_LICENSE_DATA:?Set UNIC_LICENSE_DATA in .env}
      Api_License_Url: ${API_LICENSE_URL:-https://service.example.org/}
      Keycloak__ApplicationJwt__SigningKey: ${VAULT_JWT_SIGNING_KEY:?Set VAULT_JWT_SIGNING_KEY in .env}
      Keycloak__ApplicationJwt__Issuer: ${VAULT_JWT_ISSUER:-UniComm PRO Software}
      Keycloak__ApplicationJwt__Audience: ${VAULT_JWT_AUDIENCE:-Service}
    ports:
      - "30111:8080"
    depends_on:
      vault:
        condition: service_healthy
      logger:
        condition: service_healthy
      router:
        condition: service_healthy
      syslog:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks: [unicnet]

  frontend:
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/unicnetfront:${UNICNETFRONT_IMAGE_TAG:?Set UNICNETFRONT_IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      <<: *vault-client-environment
      api.vault.name: UNFrontV2
      UniCommLicenseData: ${UNIC_LICENSE_DATA:?Set UNIC_LICENSE_DATA in .env}
      Api_License_Url: ${API_LICENSE_URL:-https://service.example.org/}
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks: [unicnet]

networks:
  unicnet:
    name: unicnet_network

volumes:
  postgres-data:

