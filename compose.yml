name: unicnet-docker-test

x-job: &job
  image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/unicnetinit:${UNICNET_INIT_TAG:-rc-init-test-20261026}
  pull_policy: missing
  restart: "no"
  volumes:
    - init-state:/state
  extra_hosts: ["host.docker.internal:host-gateway"]

x-app: &app
  restart: unless-stopped
  stop_grace_period: 40s
  entrypoint: ["/bin/sh", "/entrypoints/app.sh"]
  extra_hosts: ["host.docker.internal:host-gateway"]
  healthcheck:
    test: ["CMD-SHELL", "pidof dotnet >/dev/null"]
    interval: 10s
    timeout: 5s
    retries: 24

services:
  prepare:
    <<: *job
    command: ["prepare"]
    environment:
      UNICNET_HOST: ${UNICNET_HOST:?Copy .env.example to .env}
      UNICNET_CIDR: ${UNICNET_CIDR:?Set UNICNET_CIDR}
      UNICNET_IMAGE_TAG: ${UNICNET_IMAGE_TAG:-rc-init-test-20261026}
      UNICNET_PG_MODE: external
      UNICNET_KC_MODE: external
    volumes:
      - init-state:/state
      - pg-config:/configs/pg
      - keycloak-config:/configs/keycloak
      - vault-config:/configs/vault
      - logger-config:/configs/logger
      - router-config:/configs/router
      - syslog-config:/configs/syslog
      - backend-config:/configs/backend
      - frontend-config:/configs/frontend
      - keycloak-import:/realm
      - frontend-keyring:/frontend/keyring
      - type: bind
        source: ./license.txt
        target: /input/license.txt
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./infrastructure.json
        target: /input/infrastructure.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./frontend-settings.json
        target: /frontend/front.adm.cfg
        bind: {create_host_path: false}

  database:
    <<: *job
    command: ["database"]
    depends_on:
      prepare: {condition: service_completed_successfully}

  init:
    <<: *job
    command: ["init"]
    depends_on:
      vault: {condition: service_healthy}

  vault:
    <<: *app
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/unicvault:${UNICNET_IMAGE_TAG:-rc-init-test-20261026}
    command: ["Unic.Vault.dll"]
    volumes:
      - vault-config:/run/unicnet:ro
      - ./entrypoints/app.sh:/entrypoints/app.sh:ro
    ports: ["127.0.0.1:8200:8080"]
    depends_on:
      database: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/openapi/v1.json >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 24

  logger:
    <<: *app
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/uniclogger:${UNICNET_IMAGE_TAG:-rc-init-test-20261026}
    command: ["Unic.Logger.dll"]
    volumes: ["logger-config:/run/unicnet:ro", "./entrypoints/app.sh:/entrypoints/app.sh:ro"]
    ports: ["8082:8080"]
    depends_on:
      init: {condition: service_completed_successfully}

  router:
    <<: *app
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/unicnetrouter:${UNICNET_IMAGE_TAG:-rc-init-test-20261026}
    command: ["UnicNet.Router.dll"]
    volumes: ["router-config:/run/unicnet:ro", "./entrypoints/app.sh:/entrypoints/app.sh:ro"]
    ports: ["30115:8080"]
    depends_on:
      init: {condition: service_completed_successfully}
      logger: {condition: service_healthy}

  syslog:
    <<: *app
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/unicnetsyslog:${UNICNET_IMAGE_TAG:-rc-init-test-20261026}
    command: ["UnicNet.SysLog.dll"]
    volumes: ["syslog-config:/run/unicnet:ro", "./entrypoints/app.sh:/entrypoints/app.sh:ro"]
    ports: ["8001:8080", "514:514/udp", "601:601", "601:601/udp", "6514:6514"]
    depends_on:
      init: {condition: service_completed_successfully}
      logger: {condition: service_healthy}

  backend:
    <<: *app
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/unicnetbackend:${UNICNET_IMAGE_TAG:-rc-init-test-20261026}
    command: ["UnicNet.Backend.dll"]
    volumes: ["backend-config:/run/unicnet:ro", "./entrypoints/app.sh:/entrypoints/app.sh:ro"]
    ports: ["30111:8080"]
    depends_on:
      init: {condition: service_completed_successfully}
      router: {condition: service_healthy}
      syslog: {condition: service_healthy}

  frontend:
    <<: *app
    image: cr.yandex/crpi5ll6mqcn793fvu9i/unic/unicnetfront:${UNICNET_IMAGE_TAG:-rc-init-test-20261026}
    command: ["UnicNet.Front.dll"]
    environment:
      api.vault.name: UNFrontV2
    volumes:
      - frontend-config:/run/unicnet:ro
      - ./entrypoints/app.sh:/entrypoints/app.sh:ro
      - frontend-keyring:/app/keyring
      - type: bind
        source: ./frontend-settings.json
        target: /app/front.adm.cfg
        bind: {create_host_path: false}
    ports: ["8080:8080"]
    depends_on:
      backend: {condition: service_healthy}

  verify:
    <<: *job
    command: ["verify"]
    depends_on:
      frontend: {condition: service_healthy}

volumes:
  init-state:
  pg-config:
  keycloak-config:
  vault-config:
  logger-config:
  router-config:
  syslog-config:
  backend-config:
  frontend-config:
  frontend-keyring:
  keycloak-import:
